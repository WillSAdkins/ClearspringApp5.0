<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clearspring</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #FBF8F3;
    color: #2b2723;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 2rem;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #171512; color: #ece7e0; }
  }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .6rem; }
  p { margin: 0 0 1.6rem; opacity: .75; line-height: 1.5; max-width: 30ch; }
  button {
    font: inherit;
    font-weight: 600;
    padding: .8rem 1.8rem;
    border: 0;
    border-radius: 999px;
    background: #2b2723;
    color: #FBF8F3;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    button { background: #ece7e0; color: #171512; }
  }
</style>
</head>
<body>
  <main>
    <h1>No connection</h1>
    <p>Clearspring needs an internet connection to load. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
